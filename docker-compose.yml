services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myass
      MYSQL_USER: myass
      MYSQL_PASSWORD: myass
    ports:
      - "3306:3306"
    volumes:
      - myass_mysql:/var/lib/mysql

volumes:
  myass_mysql:
